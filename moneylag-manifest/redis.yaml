---
apiVersion: v1
kind: Service
metadata:
  name: crud-redis
  labels:
    app: crud-redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: crud-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crud-redis
spec:
  serviceName: crud-redis
  replicas: 1
  selector:
    matchLabels:
      app: crud-redis
  template:
    metadata:
      labels:
        app: crud-redis
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: redis
          image: redis:alpine3.22

          ports:
            - containerPort: 6379
              name: redis

          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          volumeMounts:
            - name: redis-data
              mountPath: /data

          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi        
---
