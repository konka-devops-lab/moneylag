---
apiVersion: v1
kind: Secret
metadata:
  name: moneylag-backend-secret
type: Opaque
stringData:
  DB_PASSWORD: moneylagApp@1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: moneylag-backend-config
data:
  DB_HOST: moneylag-mysql
  DB_NAME: moneylag_app
  DB_USER: moneylag
  REDIS_HOST: moneylag-redis
  REDIS_SSL: "false"
  FEATURE_UPDATE: "true"
  FEATURE_DELETE_ALL: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneylag-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moneylag-backend
  template:
    metadata:
      labels:
        app: moneylag-backend
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: moneylag-backend
          image: moneylag-backend:v1

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: moneylag-backend-config
            - secretRef:
                name: moneylag-backend-secret

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: moneylag-backend
spec:
  type: ClusterIP
  selector:
    app: moneylag-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: moneylag-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: moneylag-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: moneylag-backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: moneylag-backend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-default-deny
spec:
  podSelector:
    matchLabels:
      app: moneylag-backend
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      app: moneylag-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: moneylag-frontend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-redis
spec:
  podSelector:
    matchLabels:
      app: moneylag-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: crud-redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-mysql
spec:
  podSelector:
    matchLabels:
      app: moneylag-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: moneylag-mysql
      ports:
        - protocol: TCP
          port: 3306
