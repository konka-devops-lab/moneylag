apiVersion: v1
kind: ConfigMap
metadata:
  name: moneylag-frontend-nginx
data:
  default.conf: |
    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://moneylag-backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx_status {
            stub_status;
            allow all;
        }

        location = /env.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: moneylag-frontend-env
data:
  env.js: |
    window._env_ = {
      ENABLE_UPDATE: true,
      ENABLE_DELETE_ALL: true
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneylag-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moneylag-frontend
  template:
    metadata:
      labels:
        app: moneylag-frontend
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: frontend
          image: moneylag-frontend:v1

          ports:
            - containerPort: 80

          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

            - name: env-config
              mountPath: /usr/share/nginx/html/env.js
              subPath: env.js
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

      volumes:
        - name: nginx-config
          configMap:
            name: moneylag-frontend-nginx

        - name: env-config
          configMap:
            name: moneylag-frontend-env
---
apiVersion: v1
kind: Service
metadata:
  name: moneylag-frontend
spec:
  type: ClusterIP
  selector:
    app: moneylag-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: moneylag-frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: moneylag-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: moneylag-frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: moneylag-frontend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-default-deny
spec:
  podSelector:
    matchLabels:
      app: moneylag-frontend
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend
spec:
  podSelector:
    matchLabels:
      app: moneylag-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      app: moneylag-frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: moneylag-backend
      ports:
        - protocol: TCP
          port: 8080
